{% extends "base.html" %}
{% block title %}Sign Up | Attachify{% endblock %}

{% block content %}
<div class="container auth-page">
    <h1 class="display">Create Your Account</h1>
    <form id="signup-form" class="auth-form">
        <label>Full Name
            <input type="text" name="full_name" required>
        </label>
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Password
            <input type="password" name="password" required minlength="8">
        </label>
        <p id="signup-error" class="form-message form-message--error" hidden></p>
        <button type="submit" class="btn btn--primary">Sign Up</button>
    </form>
    <p class="meta">Already have an account? <a href="/login">Log in</a></p>
</div>
<script>
document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("signup-error");
    errorEl.hidden = true;
    const form = new FormData(e.target);
    const email = form.get("email");
    const password = form.get("password");
    try {
        const registerResponse = await fetch("/api/v1/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ full_name: form.get("full_name"), email, password }),
        });
        if (!registerResponse.ok) {
            const data = await registerResponse.json().catch(() => ({}));
            errorEl.textContent = data.detail || "Could not create your account.";
            errorEl.hidden = false;
            return;
        }
        const loginResponse = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
        });
        const loginData = await loginResponse.json();
        setTokens(loginData.access_token, loginData.refresh_token);
        window.location.href = "/dashboard";
    } catch (err) {
        errorEl.textContent = "Something went wrong. Please try again.";
        errorEl.hidden = false;
    }
});
</script>
{% endblock %}
