{% extends "base.html" %}
{% block title %}Log In | Attachify{% endblock %}

{% block content %}
<div class="container auth-page">
    <h1 class="display">Log In</h1>
    <form id="login-form" class="auth-form">
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <p id="login-error" class="form-message form-message--error" hidden></p>
        <button type="submit" class="btn btn--primary">Log In</button>
    </form>
    <p class="meta">Don't have an account? <a href="/signup">Sign up</a></p>
</div>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("login-error");
    errorEl.hidden = true;
    const form = new FormData(e.target);
    try {
        const response = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: form.get("email"), password: form.get("password") }),
        });
        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            errorEl.textContent = data.detail || "Login failed. Check your email and password.";
            errorEl.hidden = false;
            return;
        }
        const data = await response.json();
        setTokens(data.access_token, data.refresh_token);
        window.location.href = "/dashboard";
    } catch (err) {
        errorEl.textContent = "Something went wrong. Please try again.";
        errorEl.hidden = false;
    }
});
</script>
{% endblock %}
