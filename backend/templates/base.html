<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Attachify | Verified attachment and internship opportunities in Kenya{% endblock %}</title>
    <meta name="description" content="{% block description %}The fastest place to discover verified attachment and internship opportunities in Kenya, powered by AI.{% endblock %}">
    <meta name="theme-color" content="#000521">
    <link rel="canonical" href="{% block canonical %}{{ request.url }}{% endblock %}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Attachify">
    <meta property="og:title" content="{% block og_title %}Attachify{% endblock %}">
    <meta property="og:description" content="{% block og_description %}The fastest place to discover verified attachment and internship opportunities in Kenya, powered by AI.{% endblock %}">
    <meta property="og:url" content="{{ request.url }}">
    <meta name="twitter:card" content="summary">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Attachify",
      "url": "{{ request.base_url }}",
      "description": "The fastest place to discover verified attachment and internship opportunities in Kenya, powered by AI."
    }
    </script>
    {% block structured_data %}{% endblock %}
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header class="site-header">
        <div class="container site-header__inner">
            <a href="/" class="site-header__logo">Attachify</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="/search">Search</a>
                <a href="/companies">Companies</a>
            </nav>
        </div>
    </header>
    <main id="main">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Attachify. Built in Kenya. <a href="/how-we-verify">How we verify listings</a></p>
        </div>
    </footer>
</body>
</html>
